<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#351c75">
  <title>Login | AstroAskAQuestion</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.55 Arial, Helvetica, sans-serif; color: #24124f; background: #f8f6fd; }
    header { background: #351c75; color: white; padding: 22px max(18px, calc((100vw - 980px)/2)); }
    header a { color: white; font-weight: bold; text-decoration: none; }
    main { max-width: 520px; margin: 52px auto; padding: 30px; background: white; border-radius: 14px; box-shadow: 0 8px 30px #24124f1a; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    button { display: block; width: 100%; padding: 14px 18px; margin-top: 22px; border: 0; border-radius: 8px; background: #351c75; color: white; font: inherit; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #sign-out { background: white; color: #351c75; border: 2px solid #351c75; }
    #status { min-height: 2.8em; margin-top: 20px; }
    footer { text-align: center; padding: 20px; }
    footer a { color: #351c75; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) { main { margin: 20px 12px; padding: 23px; } }
  </style>
<style>@media screen and (max-width:560px){main{width:calc(100% - 24px);margin:20px auto;padding:22px 16px}header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}

/* Phone layouts, including iPhone safe areas and narrow Android screens. */
@media screen {
 html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
 body{overflow-wrap:anywhere}
 main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(48px,calc(24px + env(safe-area-inset-bottom)))}
 main>*,section,form,fieldset,.card,.row>*{min-width:0;max-width:100%}
 img,svg,video{max-width:100%;height:auto}
 button,input,select,textarea{max-width:100%;min-width:0;font-size:16px}
 button,summary{min-height:48px;white-space:normal;overflow-wrap:anywhere;line-height:1.4;touch-action:manipulation}
 input:not([type=radio]):not([type=checkbox]),select{min-height:48px;width:100%}
 .choice{min-height:44px;max-width:100%}
 .row{display:flex;flex-wrap:wrap;gap:8px}
 .row>button{flex:1 1 140px;width:auto}
 .answer,.report,#report-text{overflow-wrap:anywhere;word-break:normal}
 dialog{max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);overflow-y:auto}
 @media(max-width:480px){
  main{padding-top:max(20px,env(safe-area-inset-top))}
  h1{font-size:clamp(22px,6vw,28px)}
  .card{padding:16px 12px}
  button{padding:12px 14px}
 }
 @media(max-width:400px){.row{flex-direction:column}.row>button{flex:none;width:100%}}
}
</style><style id="mobile-compatibility">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media screen and (max-width:700px){
  body{overflow-wrap:anywhere}
  img,svg,video,canvas,iframe{max-width:100%;height:auto}
  header,nav,main,footer,section,article,.container,.header-container{min-width:0;max-width:100%}
  input,select,textarea,button{max-width:100%;touch-action:manipulation}
  button,summary,.play-button{min-height:44px}
}
@supports(padding:max(0px)){
  header,nav,footer{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
</style></head>
<body>
  <header><a href="index.html">AstroAskAQuestion</a></header>
  <main>
    <h1>Login</h1>
    <p>Use the same Google account as the Android app to access your AstroAskAQuestion account.</p>
    <button id="sign-in" type="button" disabled>Continue with Google</button>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <p id="status" role="status" aria-live="polite">Checking login configuration…</p>
  </main>
  <footer><a href="privacy-policy.html">Privacy Policy</a> · <a href="account-deletion.html">Account Deletion</a></footer>
  <script type="module">
import {startWebsiteLanguage} from "./website-language.mjs";
startWebsiteLanguage();
    const firebaseConfig = {
  "apiKey": "AIzaSyBA4HhtLV4iGdTR5BJIGaar4jGLPsbBLAY",
  "authDomain": "astroask-website.firebaseapp.com",
  "projectId": "astroask-website",
  "storageBucket": "astroask-website.firebasestorage.app",
  "messagingSenderId": "916860375828",
  "appId": "1:916860375828:web:617082973c4a8c0ff86801"
};

    const signInButton = document.getElementById("sign-in");
    const signOutButton = document.getElementById("sign-out");
    const status = document.getElementById("status");
    try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js");
        const { getAuth, GoogleAuthProvider, browserLocalPersistence, onAuthStateChanged, setPersistence, signInWithPopup, signOut } =
          await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
        const auth = getAuth(initializeApp(firebaseConfig));
        const provider = new GoogleAuthProvider();
        const timeoutMs = 15 * 60 * 1000;
        const activityKey = "astroask-website-last-activity";
        let signingOut = false;
        let backGuard = false;
        let lastActivity = Number(localStorage.getItem(activityKey)) || Date.now();
        let timer;

        async function endSession(message, goHome = false) {
          if (signingOut) return;
          signingOut = true;
          clearTimeout(timer);
          localStorage.removeItem(activityKey);
          signInButton.hidden = true;
          signOutButton.hidden = true;
          status.textContent = "Signing out…";
          try {
            await signOut(auth);
            status.textContent = message;
            if (goHome) window.location.replace("index.html");
          } catch {
            status.textContent = "Could not sign out. Please try again.";
            signOutButton.hidden = false;
          } finally {
            signingOut = false;
          }
        }

        function checkInactivity() {
          if (!auth.currentUser || signingOut) return;
          lastActivity = Number(localStorage.getItem(activityKey)) || lastActivity;
          const remaining = timeoutMs - (Date.now() - lastActivity);
          if (remaining <= 0) {
            void endSession("Signed out after 15 minutes of inactivity.");
          } else {
            clearTimeout(timer);
            timer = setTimeout(checkInactivity, remaining);
          }
        }

        function markActivity() {
          if (!auth.currentUser || signingOut) return;
          const now = Date.now();
          if (now - lastActivity >= timeoutMs) {
            checkInactivity();
            return;
          }
          if (now - lastActivity < 1000) return;
          lastActivity = now;
          localStorage.setItem(activityKey, String(now));
          checkInactivity();
        }

        for (const event of ["pointerdown", "keydown", "scroll", "touchstart"]) {
          window.addEventListener(event, markActivity, { passive: true });
        }
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) checkInactivity();
        });
        window.addEventListener("focus", checkInactivity);
        window.addEventListener("storage", event => {
          if (event.key === activityKey) checkInactivity();
        });
        window.addEventListener("pageshow", event => {
          if (event.persisted) void endSession("Signed out when you left the login page.");
        });
        window.addEventListener("popstate", () => {
          if (auth.currentUser) void endSession("Signed out when you pressed Back.", true);
        });

        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, user => {
          if (signingOut) return;
          if (user && Date.now() - lastActivity >= timeoutMs) {
            void endSession("Signed out after 15 minutes of inactivity.");
            return;
          }
          signInButton.hidden = Boolean(user);
          signOutButton.hidden = !user;
          signInButton.disabled = false;
          if (user) {
            lastActivity = Number(localStorage.getItem(activityKey)) || 0;
            if (!lastActivity) { void endSession("Your session has ended. Please sign in again."); return; }
            if (!backGuard) {
              history.pushState({ astroaskLoginGuard: true }, "", window.location.href);
              backGuard = true;
            }
            checkInactivity();
            window.location.replace("welcome.html");
          } else {
            clearTimeout(timer);
            localStorage.removeItem(activityKey);
          }
          status.textContent = user
            ? `Signed in as ${user.displayName || user.email || "Google user"}. Website account features are being prepared.`
            : "Choose your Google account to sign in.";
        }, () => { status.textContent = "Could not check your sign-in status. Please reload the page."; });
        signInButton.addEventListener("click", async () => {
          signInButton.disabled = true;
          status.textContent = "Opening Google sign-in…";
          try {
            lastActivity = Date.now();
            localStorage.setItem(activityKey, String(lastActivity));
            await signInWithPopup(auth, provider);
            lastActivity = Date.now();
            localStorage.setItem(activityKey, String(lastActivity));
            checkInactivity();
          }
          catch (error) {
            if (!auth.currentUser) localStorage.removeItem(activityKey);
            status.textContent = error.code === "auth/popup-closed-by-user"
              ? "Sign-in cancelled. You can try again."
              : `Sign-in failed (${error.code || "unknown error"}). Check the Firebase website configuration and authorized domain.`;
          } finally { signInButton.disabled = false; }
        });
        signOutButton.addEventListener("click", () => void endSession("Choose your Google account to sign in."));
    } catch {
      status.textContent = "Login could not load. Check your internet connection and try again.";
    }
  </script>
</body>
</html>
